<body data-page="programs">
<a class="skip-link" href="#main">Skip to main content</a>
<header id="site-header"><noscript><nav class="container" aria-label="Main links"><ul><li><a href="index.html">Home</a></li><li><a href="programs.html">Academics</a></li><li><a href="admissions.html">Admissions</a></li><li><a href="research.html">Research &amp; Innovation</a></li><li><a href="campus.html">Campus Life</a></li><li><a href="campus.html#placements">Placements &amp; Careers</a></li><li><a href="contact.html">About</a></li></ul></nav></noscript></header>
<main id="main" tabindex="-1">
  <div class="container section">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Programmes</li></ol></nav>
    <h1>Find a programme</h1>
    <p class="lede">The entries below are placeholders until verified against official programme pages. Filter by a field and programmes with unknown values are hidden.</p>
    <p class="alert alert--info" id="audience-note" hidden></p>
    <noscript><p class="alert alert--warn">The finder needs JavaScript. Use the <a href="https://www.srmist.edu.in/program-finder/">official programme finder</a>.</p></noscript>

    <form id="finder-form" class="filters" role="search" aria-label="Programme filters">
      <div class="field"><label class="field__label" for="f-q">Search</label><input class="field__control" type="search" id="f-q" autocomplete="off" placeholder="Name, college or keyword"></div>
      <div class="field"><label class="field__label" for="f-level">Level</label><select class="field__control" id="f-level"><option value="">Any level</option></select></div>
      <div class="field"><label class="field__label" for="f-mode">Mode</label><select class="field__control" id="f-mode"><option value="">Any mode</option></select></div>
      <div class="field"><label class="field__label" for="f-type">Type</label><select class="field__control" id="f-type"><option value="">Any type</option></select></div>
      <div class="field"><label class="field__label" for="f-college">College</label><select class="field__control" id="f-college"><option value="">Any college</option></select></div>
      <div class="field"><label class="field__label" for="f-campus">Campus</label><select class="field__control" id="f-campus"><option value="">Any campus</option></select></div>
      <div class="field"><label class="field__label" for="f-dept">Department</label><select class="field__control" id="f-dept"><option value="">Any department</option></select></div>
      <div class="field"><label class="field__label" for="f-sort">Sort by</label>
        <select class="field__control" id="f-sort"><option value="name">Name</option><option value="fee">Annual fee (low to high)</option><option value="duration">Duration (short to long)</option></select></div>
      <fieldset><legend>Interests (shows programmes matching any selected)</legend><ul class="chip-group" id="f-interests"></ul></fieldset>
      <div><button type="button" class="btn" id="f-clear">Clear filters</button></div>
    </form>

    <div class="results-bar"><p id="result-count" role="status" aria-live="polite" class="h4">Loading programmes</p></div>
    <div id="results" class="grid grid--2"></div>
  </div>
</main>
<footer id="site-footer"></footer>
</body>
</html>
